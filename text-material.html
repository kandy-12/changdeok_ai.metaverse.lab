<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자료 열람 · [자료 제목을 입력하세요]</title>

<!--
  ════════════════════════════════════════════════════════════
  사용 안내 (텍스트 자료용)
  ════════════════════════════════════════════════════════════
  1) [설정]이라고 써있는 부분만 바꾸면 됩니다.
  2) 좌측 상단 로고: assets 폴더에 배경이 투명한 로고 이미지를
     "school-logo.png" 라는 이름으로 넣으면 자동으로 표시됩니다.
     (경로는 <img class="logo" src="..."> 부분에서 바꿀 수 있어요)
  3) 본문 텍스트는 흰색 사각형(.text-box) 안의 <p> 태그에 넣으세요.
  ════════════════════════════════════════════════════════════
-->

<style>
  :root{
    --page-bg: #eaf1fb;      /* 페이지 배경 - 옅은 푸른색 */
    --navy-deep: #1c3b63;    /* 진한 남색 - 제목/텍스트 */
    --navy-mid: #2f5586;     /* 중간 남색 - 보조 텍스트 */
    --navy-pale: #cfe0f5;    /* 연한 남색 - 자료 담는 사각형 */
    --navy-pale-line: #a9c6e8;
    --yellow: #f3b301;       /* 포인트 컬러 */
    --yellow-deep: #c98e00;
    --white: #ffffff;
    --ink-soft: #5c7291;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--page-bg);
    color: var(--navy-deep);
    font-family: "Noto Sans KR", "Inter", -apple-system, sans-serif;
    line-height: 1.65;
    padding: 40px 20px 80px;
    display: flex;
    justify-content: center;
  }

  .card{
    width: 100%;
    max-width: 760px;
    background: var(--white);
    border-radius: 18px;
    box-shadow: 0 20px 44px -30px rgba(28,59,99,0.45);
    overflow: hidden;
  }

  /* ── 헤더: 로고 + 자료 종류 스탬프 ── */
  .card-head{
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 26px 32px 0;
  }

  .logo-slot{
    height: 44px;
    display: flex;
    align-items: center;
  }
  .logo-slot img.logo{
    max-height: 44px;
    max-width: 140px;
    object-fit: contain;
  }
  /* 로고 이미지가 아직 없을 때 자리 표시 (배치 후 지워도 됨) */
  .logo-slot .logo-placeholder{
    font-size: 11px;
    color: var(--ink-soft);
    border: 1px dashed var(--navy-pale-line);
    border-radius: 8px;
    padding: 10px 14px;
  }

  .stamp{
    font-family: "IBM Plex Mono", "Courier New", monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--navy-deep);
    background: var(--yellow);
    padding: 6px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .subject{
    font-size: 13px;
    color: var(--navy-mid);
    margin: 22px 32px 0;
    letter-spacing: .02em;
    font-weight: 600;
  }

  h1{
    font-family: "Noto Sans KR", sans-serif;
    font-size: 26px;
    font-weight: 800;
    line-height: 1.45;
    margin: 8px 32px 18px;
    color: var(--navy-deep);
  }

  .meta{
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    margin: 0 32px 24px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .meta span::before{ content: "· "; color: var(--navy-pale-line); }
  .meta span:first-child::before{ content: ""; }

  /* ── 자료를 담는 연한 남색 둥근 사각형 ── */
  .content{
    margin: 0 32px 32px;
  }

  .navy-frame{
    background: var(--navy-pale);
    border: 1px solid var(--navy-pale-line);
    border-radius: 20px;
    padding: 22px;
  }

  /* 텍스트 버전: 남색 사각형 안 흰색 사각형(각짐) */
  .text-box{
    background: var(--white);
    border-radius: 0;
    padding: 24px 26px;
    font-size: 16px;
    color: var(--navy-deep);
    border-top: 4px solid var(--yellow);
  }
  .text-box p{ margin: 0 0 14px; }
  .text-box p:last-child{ margin-bottom: 0; }

  .excerpt-source{
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--navy-mid);
    font-family: "IBM Plex Mono", "Courier New", monospace;
  }

  .card-foot{
    margin-top: 6px;
    padding: 18px 32px 26px;
    border-top: 1px dashed var(--navy-pale-line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .back-link{
    font-size: 13px;
    color: var(--navy-mid);
    text-decoration: none;
    font-weight: 700;
    border-bottom: 2px solid var(--yellow);
  }
  .back-link:hover{ color: var(--navy-deep); }

  .card-foot .updated{
    font-size: 12px;
    color: var(--ink-soft);
    font-family: "IBM Plex Mono", "Courier New", monospace;
  }

  @media (max-width: 560px){
    .card-head, .subject, h1, .meta, .content, .card-foot{
      margin-left: 20px;
      margin-right: 20px;
    }
    h1{ font-size: 21px; }
  }
</style>
</head>
<body>

<main class="card">

  <div class="card-head">
    <!-- [설정] 로고: assets/school-logo.png 를 넣으면 아래 img가 표시됩니다 -->
    <div class="logo-slot">
      <img class="logo" src="assets/school-logo.png" alt="학교 로고"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <span class="logo-placeholder" style="display:none;">로고 자리</span>
    </div>

    <span class="stamp">TEXT</span>
  </div>

  <!-- [설정] 상위 분류(과목/단원 등) -->
  <p class="subject">국어 · 문학 — 시와 이야기</p>

  <!-- [설정] 자료 제목 -->
  <h1>자료 제목을 여기에 입력하세요</h1>

  <!-- [설정] 메타 정보: 필요한 항목만 남기고 자유롭게 수정/삭제 -->
  <div class="meta">
    <span>출처: 예) 국어 교과서 3-2</span>
    <span>페이지: 예) p.34–36</span>
  </div>

  <div class="content">
    <div class="navy-frame">
      <div class="text-box">
        <!-- [설정] 발췌한 본문 텍스트. 문단이 여러 개면 <p>를 나누어 넣으세요 -->
        <p>여기에 발췌한 본문 텍스트를 넣으세요.</p>
        <p>두 번째 문단 예시입니다.</p>
        <div class="excerpt-source">원문 출처를 여기에 표기하세요</div>
      </div>
    </div>
  </div>

  <div class="card-foot">
    <a class="back-link" href="index.html">← 목록으로</a>
    <span class="updated">최종 수정: 2026-08-28</span>
  </div>

</main>

</body>
</html>
