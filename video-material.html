<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자료 열람 · [자료 제목을 입력하세요]</title>

<!--
  ════════════════════════════════════════════════════════════
  사용 안내 (영상 자료용)
  ════════════════════════════════════════════════════════════
  1) [설정]이라고 써있는 부분만 바꾸면 됩니다.
  2) 좌측 상단 로고: assets/school-logo.png (배경 투명 이미지) 를
     넣으면 자동으로 표시됩니다.
  3) .video-frame 안의 iframe src를 유튜브 등 영상 임베드 주소로 바꾸세요.
  ════════════════════════════════════════════════════════════
-->

<style>
  :root{
    --page-bg: #eaf1fb;
    --navy-deep: #1c3b63;
    --navy-mid: #2f5586;
    --navy-pale: #cfe0f5;
    --navy-pale-line: #a9c6e8;
    --yellow: #f3b301;
    --white: #ffffff;
    --ink-soft: #5c7291;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--page-bg);
    color: var(--navy-deep);
    font-family: "Noto Sans KR", "Inter", -apple-system, sans-serif;
    line-height: 1.65;
    padding: 40px 20px 80px;
    display: flex;
    justify-content: center;
  }

  .card{
    width: 100%;
    max-width: 760px;
    background: var(--white);
    border-radius: 18px;
    box-shadow: 0 20px 44px -30px rgba(28,59,99,0.45);
    overflow: hidden;
  }

  .card-head{
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 26px 32px 0;
  }

  .logo-slot{
    height: 44px;
    display: flex;
    align-items: center;
  }
  .logo-slot img.logo{
    max-height: 44px;
    max-width: 140px;
    object-fit: contain;
  }
  .logo-slot .logo-placeholder{
    font-size: 11px;
    color: var(--ink-soft);
    border: 1px dashed var(--navy-pale-line);
    border-radius: 8px;
    padding: 10px 14px;
  }

  .stamp{
    font-family: "IBM Plex Mono", "Courier New", monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--navy-deep);
    background: var(--yellow);
    padding: 6px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .subject{
    font-size: 13px;
    color: var(--navy-mid);
    margin: 22px 32px 0;
    letter-spacing: .02em;
    font-weight: 600;
  }

  h1{
    font-size: 26px;
    font-weight: 800;
    line-height: 1.45;
    margin: 8px 32px 18px;
    color: var(--navy-deep);
  }

  .meta{
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    margin: 0 32px 24px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .meta span::before{ content: "· "; color: var(--navy-pale-line); }
  .meta span:first-child::before{ content: ""; }

  .content{
    margin: 0 32px 32px;
  }

  .navy-frame{
    background: var(--navy-pale);
    border: 1px solid var(--navy-pale-line);
    border-radius: 20px;
    padding: 22px;
  }

  /* 영상 버전: 남색 사각형 안에 16:9 영상 프레임 */
  .video-frame{
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #0b1f36;
    border-radius: 12px;
    overflow: hidden;
    border-top: 4px solid var(--yellow);
  }
  .video-frame iframe{
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0;
  }

  .video-caption{
    margin: 14px 2px 0;
    font-size: 13px;
    color: var(--navy-mid);
  }

  .card-foot{
    margin-top: 6px;
    padding: 18px 32px 26px;
    border-top: 1px dashed var(--navy-pale-line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .back-link{
    font-size: 13px;
    color: var(--navy-mid);
    text-decoration: none;
    font-weight: 700;
    border-bottom: 2px solid var(--yellow);
  }
  .back-link:hover{ color: var(--navy-deep); }

  .card-foot .updated{
    font-size: 12px;
    color: var(--ink-soft);
    font-family: "IBM Plex Mono", "Courier New", monospace;
  }

  @media (max-width: 560px){
    .card-head, .subject, h1, .meta, .content, .card-foot{
      margin-left: 20px;
      margin-right: 20px;
    }
    h1{ font-size: 21px; }
  }
</style>
</head>
<body>

<main class="card">

  <div class="card-head">
    <div class="logo-slot">
      <img class="logo" src="assets/school-logo.png" alt="학교 로고"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <span class="logo-placeholder" style="display:none;">로고 자리</span>
    </div>

    <span class="stamp">VIDEO</span>
  </div>

  <!-- [설정] 상위 분류 -->
  <p class="subject">과학 · 지구와 우주</p>

  <!-- [설정] 자료 제목 -->
  <h1>자료 제목을 여기에 입력하세요</h1>

  <!-- [설정] 메타 정보 -->
  <div class="meta">
    <span>출처: 예) EBS 초등 과학</span>
    <span>분량: 예) 6분 30초</span>
  </div>

  <div class="content">
    <div class="navy-frame">
      <div class="video-frame">
        <!-- [설정] 영상 임베드 주소로 교체하세요 -->
        <iframe src="https://www.youtube.com/embed/영상ID"
          title="영상 제목" allowfullscreen></iframe>
      </div>
    </div>
    <p class="video-caption"><!-- [설정] --> 영상에 대한 짧은 설명을 여기에 적으세요.</p>
  </div>

  <div class="card-foot">
    <a class="back-link" href="index.html">← 목록으로</a>
    <span class="updated">최종 수정: 2026-08-28</span>
  </div>

</main>

</body>
</html>
